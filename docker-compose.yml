# Local/staging orchestration. DATABASE_URL is a hosted Postgres (Neon) —
# see backend/.env.example — so there is no local `postgres` service here;
# that matches how this stack actually runs in production.
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
