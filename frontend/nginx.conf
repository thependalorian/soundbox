server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth: this console renders merchant, transaction and
    # regulator data, and now issues/holds a bearer token in localStorage.
    # add_header on `server` applies to every response, including the SPA
    # shell and the JS bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CRA injects no inline scripts; connect-src covers XHR/fetch to the API
    # (same-origin via reverse proxy, or REACT_APP_API_URL's origin in a
    # split deployment -- tighten this to the exact API origin once fixed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'" always;

    # SPA client-side routing: fall back to index.html for unmatched paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
